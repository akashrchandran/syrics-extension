<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syrics - Spotify Lyrics Downloader</title>
  <style>
    body {
      width: 350px;
      min-height: 400px;
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
    }
    
    .container {
      padding: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .logo h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(45deg, #1db954, #1ed760);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      margin: 0;
      font-size: 14px;
      opacity: 0.9;
    }
    
    .test-button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #1db954;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 16px;
    }
    
    .test-button:hover:not(:disabled) {
      background: #1ed760;
      transform: translateY(-1px);
    }
    
    .test-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    
    .status {
      display: none;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.4;
    }
    
    .status.success {
      background: rgba(29, 185, 84, 0.2);
      border: 1px solid #1db954;
    }
    
    .status.warning {
      background: rgba(255, 165, 0, 0.2);
      border: 1px solid #ffa500;
    }
    
    .status.error {
      background: rgba(226, 33, 52, 0.2);
      border: 1px solid #e22134;
    }
    
    .instructions {
      background: rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    
    .instructions h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      font-weight: 600;
    }
    
    .instructions ol {
      margin: 0;
      padding-left: 20px;
    }
    
    .instructions li {
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
    
    .instructions a {
      color: #1ed760;
      text-decoration: none;
    }
    
    .instructions a:hover {
      text-decoration: underline;
    }
    
    .footer {
      text-align: center;
      font-size: 12px;
      opacity: 0.8;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <span style="font-size: 24px;">🎵</span>
        <h1>Syrics</h1>
      </div>
      <p class="subtitle">Spotify Lyrics Downloader</p>
    </div>
    
    <button id="testButton" class="test-button">Test Extension</button>
    
    <div id="status" class="status"></div>
    
    <div class="instructions">
      <h3>How to use:</h3>
      <ol>
        <li>Navigate to <a href="https://open.spotify.com" target="_blank">open.spotify.com</a></li>
        <li>Find any track and click the three-dot menu</li>
        <li>Select "Download Lyrics" from the menu</li>
        <li>Lyrics will be downloaded as an LRC file</li>
      </ol>
    </div>
    
    <div class="footer">
      <p>Made with ❤️ for music lovers</p>
    </div>
  </div>
  
  <script src="popup-simple.js"></script>
</body>
</html>
